<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Your Page</title>
    <div id="box">
      Click to start
    </div>
    <script>
      var time = 0
      var green = 0
      var timeout = 0
      var state = 'ready'
      var times = []
      const square = document.getElementById("box")
      const round = document.createElement("span")
      console.log(square)
      function handleClick() {
        if (state === 'waiting'){
          clearTimeout(timeout)
          state = 'tooSoon'
          square.textContent = 'Too soon!'
          square.appendChild(round)
          square.style.backgroundColor = 'red'
        }
        else if (state === 'result'){
          startRound()
        }
        else if (state === 'tooSoon'){
          startRound()
        }
        else if (state === 'go'){
          time = Math.round(performance.now() - green)
          square.textContent = `Your time: ${time}\nClick to go again!`
          square.appendChild(round)
          state = 'result'
          times.push(time)
        }
        else if (state === 'ready'){
          startRound()
        }
      }
      function startRound() {
        state = 'waiting'
        square.textContent = 'Wait...'
        square.appendChild(round)
        square.style.backgroundColor = 'yellow'
        var delay = Math.random() * (3000) + 2000
        console.log(delay)
        timeout = setTimeout(goGreen, delay)
      }
      function goGreen() {
        state = 'go'
        square.textContent = 'Click!'
        square.appendChild(round)
        square.style.backgroundColor = 'green'
        green = performance.now()
      }
      square.addEventListener("click", handleClick)
      round.className = 'floating-text'
      round.textContent = `Round ${times.length} of 5`
      round.style.top = '0%'
      round.style.left = '50%'
      square.appendChild(round)
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
      }
      #box {
        position: relative;
        width: 80%;
        height: 750px;
        background-color: rgb(255, 0, 225);
        align-items: center;
        text-align: center;
        position: fixed;
        white-space: pre-line;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        align-content: center;
        font-size: 35px;
      }
      .floating-text {
        position: absolute;
        transform: translateX(-50%);
      }
    </style>
  </head>
</html>
